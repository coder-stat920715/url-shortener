server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: create-api
          uri: ${CREATION_URL:http://localhost:8082}
          predicates:
            - Path=/api/**
        - id: redirect
          uri: ${REDIRECT_URL:http://localhost:8083}
          predicates:
            - Path=/{shortKey}
management:
  endpoints:
    web:
      exposure:
        include: health,info
