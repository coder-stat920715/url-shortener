# Full local stack. Start with:  docker compose up --build
services:
  zookeeper:
    image: zookeeper:3.9
    ports: ["2181:2181"]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lfu"]
    ports: ["6379:6379"]

  cassandra:
    image: cassandra:4.1
    ports: ["9042:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 15s
      timeout: 10s
      retries: 20

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra: { condition: service_healthy }
    volumes: ["./docker/cassandra/schema.cql:/schema.cql:ro"]
    command: ["cqlsh", "cassandra", "-f", "/schema.cql"]
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123"]
    volumes: ["./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"

  kgs-service:
    build: { context: ., args: { MODULE: kgs-service } }
    depends_on: [zookeeper]
    environment:
      SERVER_PORT: 8081
      KGS_ZOOKEEPER_CONNECT: zookeeper:2181
      KGS_SCRAMBLER_SEED: "918273645123"
    ports: ["8081:8081"]

  url-creation-service:
    build: { context: ., args: { MODULE: url-creation-service } }
    depends_on:
      cassandra-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
      kgs-service: { condition: service_started }
    environment:
      SERVER_PORT: 8082
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra:9042
      SPRING_DATA_REDIS_HOST: redis
      SHORTENER_KGS_BASE_URL: http://kgs-service:8081
      SHORTENER_BASE_URL: http://localhost:8080
    ports: ["8082:8082"]

  redirection-service:
    build: { context: ., args: { MODULE: redirection-service } }
    depends_on:
      cassandra-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
      kafka: { condition: service_started }
    environment:
      SERVER_PORT: 8083
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra:9042
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8083:8083"]

  analytics-ingestion-service:
    build: { context: ., args: { MODULE: analytics-ingestion-service } }
    depends_on: [kafka, clickhouse]
    environment:
      SERVER_PORT: 8084
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANALYTICS_CLICKHOUSE_URL: http://clickhouse:8123
    ports: ["8084:8084"]

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    depends_on: [url-creation-service, redirection-service]
    environment:
      CREATION_URL: http://url-creation-service:8082
      REDIRECT_URL: http://redirection-service:8083
    ports: ["8080:8080"]
